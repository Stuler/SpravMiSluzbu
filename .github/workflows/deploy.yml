name: CI/CD Pipeline

on:
    push:
        branches:
            - main
            - beta
            - dev
    pull_request:
        branches:
            - main
            - beta
            - dev

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    extensions: mbstring, gd

            -   name: Install dependencies
                uses: ramsey/composer-install@v2
                with:
                    composer-options: '--prefer-dist --optimize-autoloader'

            -   name: Remove node_modules
                run: |
                    rm -rf node_modules

            -   name: Create Roští test local config
                if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
                env:
                    ROSTI_TEST_LOCAL_NEON_BASE64: ${{ secrets.ROSTI_TEST_LOCAL_NEON_BASE64 }}
                run: |
                    if [ -z "$ROSTI_TEST_LOCAL_NEON_BASE64" ]; then
                        echo "Missing required secret ROSTI_TEST_LOCAL_NEON_BASE64" >&2
                        exit 1
                    fi
                    printf '%s' "$ROSTI_TEST_LOCAL_NEON_BASE64" | base64 --decode > config/local.neon

            -   name: Deploy to dev environment
                if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
                uses: SamKirkland/FTP-Deploy-Action@4.3.1
                with:
                    server: ${{ secrets.DEV_FTP_SERVER }}
                    username: ${{ secrets.DEV_FTP_USERNAME }}
                    password: ${{ secrets.DEV_FTP_PASSWORD }}
                    port: 21
                    protocol: ftp
                    local-dir: ./ # Directory to upload
                    server-dir: ${{ secrets.DEV_FTP_SERVER_DIR || '/www/subdom/dev/' }} # Directory on server


            -   name: Prepare Roští test SSH key
                if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
                env:
                    ROSTI_TEST_SSH_KEY_BASE64: ${{ secrets.ROSTI_TEST_SSH_KEY_BASE64 }}
                run: |
                    if [ -z "$ROSTI_TEST_SSH_KEY_BASE64" ]; then
                        echo "Missing required secret ROSTI_TEST_SSH_KEY_BASE64" >&2
                        exit 1
                    fi
                    mkdir -p ~/.ssh
                    printf '%s' "$ROSTI_TEST_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/rosti_test
                    chmod 600 ~/.ssh/rosti_test

            -   name: Deploy to test environment on Roští
                if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
                env:
                    ROSTI_TEST_SSH_HOST: ssh.rosti.cz
                    ROSTI_TEST_SSH_PORT: "10434"
                    ROSTI_TEST_DEPLOY_PATH: /srv/app
                run: |
                    mkdir -p ~/.ssh
                    ssh-keyscan -p "$ROSTI_TEST_SSH_PORT" "$ROSTI_TEST_SSH_HOST" >> ~/.ssh/known_hosts
                    rsync -az --delete \
                        --exclude='.git/' \
                        --exclude='.github/' \
                        --exclude='.idea/' \
                        --exclude='.docker/data/' \
                        --exclude='node_modules/' \
                        --exclude='var/log/*' \
                        --exclude='var/tmp/*' \
                        -e "ssh -i ~/.ssh/rosti_test -o IdentitiesOnly=yes -p $ROSTI_TEST_SSH_PORT" \
                        ./ "app@$ROSTI_TEST_SSH_HOST:$ROSTI_TEST_DEPLOY_PATH/"

            -   name: Run Roští test post-deploy commands
                if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
                env:
                    ROSTI_TEST_SSH_HOST: ssh.rosti.cz
                    ROSTI_TEST_SSH_PORT: "10434"
                    ROSTI_TEST_DEPLOY_PATH: /srv/app
                run: |
                    ssh -i ~/.ssh/rosti_test -o IdentitiesOnly=yes -p "$ROSTI_TEST_SSH_PORT" "app@$ROSTI_TEST_SSH_HOST" \
                        "set -e; cd '$ROSTI_TEST_DEPLOY_PATH'; mkdir -p var/tmp var/log; chmod -R 0777 var/tmp var/log; php bin/console migrations:migrate --no-interaction --allow-no-migration; rm -rf var/tmp/cache/nette.configurator"

            -   name: Deploy to production
                if: github.ref == 'refs/heads/main' && github.event_name == 'push'
                uses: SamKirkland/FTP-Deploy-Action@4.3.1
                with:
                    server: ${{ secrets.PROD_FTP_SERVER }}
                    username: ${{ secrets.PROD_FTP_USERNAME }}
                    password: ${{ secrets.PROD_FTP_PASSWORD }}
                    port: 21
                    protocol: ftp
                    local-dir: ./ # Directory to upload
                    server-dir: ${{ secrets.PROD_FTP_SERVER_DIR || '/' }} # Directory on server

#
