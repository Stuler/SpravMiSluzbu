services:
  php:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      NETTE_DEBUG: "1"
      NETTE_ENV: dev
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); if (!$$socket) { exit(1); } fclose($$socket);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./:/var/www/html

  nginx:
    build:
      context: .
      dockerfile: ./.docker/nginx/Dockerfile
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:ro

  database:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: sprav_mi_sluzbu
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
      - ./.docker/db/01_dump.sql:/docker-entrypoint-initdb.d/01_dump.sql:ro

  adminer:
    image: dockette/adminer:dg
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  db_data: